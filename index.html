<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Login - Sistema de Atividades</title>
  <link rel="manifest" href="manifest.json?v=3">
  <meta name="theme-color" content="#1a73e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tarefas">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="logo">Sistema de Atividades</div>
    <p class="subtitle">Escaneie seu crachá para entrar</p>

    <!-- Etapa 1: Identificacao -->
    <div id="etapa-codigo">
      <div class="scan-area">
        <div id="reader"></div>
      </div>

      <button id="btn-scan" class="btn btn-primary btn-lg" onclick="iniciarScan()">
        Escanear Crachá
      </button>

      <div class="input-group mt-16">
        <input type="text" id="codigo-manual" class="input-text" placeholder="Código do crachá"
          maxlength="10" autocomplete="off">
        <button class="btn btn-primary" onclick="verificarCracha()" style="width:auto;padding:12px 20px;">
          Próximo
        </button>
      </div>
    </div>

    <!-- Etapa 2: Senha (apenas quando necessario) -->
    <div id="etapa-senha" class="hidden" style="width:100%;max-width:300px;">
      <div class="card text-center mb-12">
        <div style="font-size:0.85rem;color:#666;">Bem-vindo,</div>
        <div id="func-nome-exibido" style="font-size:1.2rem;font-weight:700;color:#1a73e8;"></div>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="input-senha" class="input-text" placeholder="Digite sua senha"
          autocomplete="current-password">
      </div>

      <button class="btn btn-primary btn-lg" onclick="fazerLogin()">
        Entrar
      </button>

      <button class="btn btn-outline mt-8" onclick="voltarCodigo()">
        Voltar
      </button>
    </div>

    <div id="login-msg" class="login-msg"></div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Verificando...</p>
    </div>

    <div id="error-actions" class="error-actions hidden" style="text-align:center;margin-top:12px;">
      <button class="btn btn-primary" onclick="recarregarPagina()" style="width:auto;">Tentar de Novo</button>
      <button class="btn btn-outline" onclick="aqueceGAS()" style="width:auto;margin-left:8px;">Ativar Servidor</button>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="js/config.js?v=6"></script>
  <script>
    // Guard de versao: detecta novo deploy e recarrega uma vez
    (function() {
      var stored = localStorage.getItem('app_version');
      var current = CONFIG.APP_VERSION;
      localStorage.setItem('app_version', current);
      if (stored && stored !== current) location.reload();
    })();
  </script>
  <script src="js/api.js?v=6"></script>
  <script src="js/auth.js?v=6"></script>
  <script src="js/scanner.js?v=6"></script>
  <script>
    if (Auth.estaLogado()) {
      const func = Auth.obterSessao();
      window.location.href = func.perfil === 'gestor' ? 'gestor.html' : 'painel.html';
    }

    if (new URLSearchParams(window.location.search).get('motivo') === 'inatividade') {
      const el = document.getElementById('login-msg');
      el.textContent = 'Sessão encerrada por inatividade. Faça login novamente.';
      el.className = 'login-msg msg-warning';
    }

    let scanAtivo = false;
    let codigoSelecionado = '';

    // Aquecer o GAS na abertura (ping silencioso)
    (async function aqueceGASNaAbertura() {
      try {
        await fetch(CONFIG.API_URL + '?acao=verificar_cracha&codigo=PING', {
          method: 'GET',
          signal: AbortSignal.timeout(3000)
        }).catch(() => {});
      } catch (e) {}
    })();

    function aqueceGAS() {
      mostrarMsg('Ativando servidor...', 'info');
      document.getElementById('error-actions').classList.add('hidden');
      (async () => {
        try {
          await fetch(CONFIG.API_URL + '?acao=verificar_cracha&codigo=PING', {
            method: 'GET',
            signal: AbortSignal.timeout(5000)
          });
          mostrarMsg('Servidor ativado. Tente novamente.', 'success');
        } catch (e) {
          mostrarMsg('Servidor indisponível. Tente em alguns segundos.', 'error');
          document.getElementById('error-actions').classList.remove('hidden');
        }
      })();
    }

    function recarregarPagina() {
      location.reload();
    }

    async function iniciarScan() {
      if (scanAtivo) {
        await Scanner.parar();
        scanAtivo = false;
        document.getElementById('btn-scan').textContent = 'Escanear Crachá';
        return;
      }

      mostrarMsg('Posicione o QRcode na câmera...', 'info');

      const sucesso = await Scanner.iniciar('reader', async (codigo) => {
        scanAtivo = false;
        document.getElementById('btn-scan').textContent = 'Escanear Crachá';
        await verificarCrachaCodigo(codigo.trim().toUpperCase());
      });

      if (sucesso) {
        scanAtivo = true;
        document.getElementById('btn-scan').textContent = 'Parar Câmera';
      } else {
        mostrarMsg('Não foi possível acessar a câmera. Use o campo manual.', 'error');
      }
    }

    // Chamado pelo botao "Proximo" no campo manual
    async function verificarCracha() {
      const codigo = document.getElementById('codigo-manual').value.trim();
      if (!codigo) {
        mostrarMsg('Digite o código do crachá.', 'warning');
        return;
      }
      await verificarCrachaCodigo(codigo.toUpperCase());
    }

    // Verifica se o cracha existe e se requer senha
    async function verificarCrachaCodigo(codigo) {
      mostrarMsg('', '');
      document.getElementById('loading').classList.add('visivel');
      document.getElementById('error-actions').classList.add('hidden');

      let resultado;
      try {
        resultado = await API.getComTimeout(
          { acao: 'verificar_cracha', codigo },
          CONFIG.LOGIN_REQUEST_TIMEOUT,
          CONFIG.LOGIN_MAX_TENTATIVAS
        );
      } catch (e) {
        resultado = { sucesso: false, mensagem: 'Erro ao verificar. Tente novamente.' };
      } finally {
        document.getElementById('loading').classList.remove('visivel');
      }

      if (!resultado || !resultado.sucesso) {
        mostrarMsg((resultado && resultado.mensagem) || 'Sem conexão. Tente novamente.', 'error');
        document.getElementById('error-actions').classList.remove('hidden');
        return;
      }

      codigoSelecionado = codigo;

      if (resultado.dados && resultado.dados.requer_senha) {
        // Exibir etapa de senha
        document.getElementById('func-nome-exibido').textContent = resultado.dados.nome;
        document.getElementById('etapa-codigo').classList.add('hidden');
        document.getElementById('etapa-senha').classList.remove('hidden');
        document.getElementById('input-senha').value = '';
        document.getElementById('input-senha').focus();
      } else {
        // Login direto sem senha
        await fazerLoginDireto();
      }
    }

    // Login sem senha (funcionarios sem senha cadastrada)
    async function fazerLoginDireto() {
      document.getElementById('loading').classList.add('visivel');

      let resultado;
      try {
        resultado = await Auth.login(codigoSelecionado, '');
      } catch (e) {
        resultado = { sucesso: false, mensagem: 'Erro ao entrar. Tente novamente.' };
      } finally {
        document.getElementById('loading').classList.remove('visivel');
      }

      if (!resultado || !resultado.sucesso) {
        mostrarMsg((resultado && resultado.mensagem) || 'Sem conexão. Tente novamente.', 'error');
        document.getElementById('error-actions').classList.remove('hidden');
      }
    }

    // Login com senha
    async function fazerLogin() {
      const senha = document.getElementById('input-senha').value;
      if (!senha) {
        mostrarMsg('Digite sua senha.', 'warning');
        return;
      }

      mostrarMsg('', '');
      document.getElementById('loading').classList.add('visivel');

      let resultado;
      try {
        resultado = await Auth.login(codigoSelecionado, senha);
      } catch (e) {
        resultado = { sucesso: false, mensagem: 'Erro ao entrar. Tente novamente.' };
      } finally {
        document.getElementById('loading').classList.remove('visivel');
      }

      if (!resultado || !resultado.sucesso) {
        mostrarMsg((resultado && resultado.mensagem) || 'Sem conexão. Tente novamente.', 'error');
        document.getElementById('error-actions').classList.remove('hidden');
      }
    }

    function voltarCodigo() {
      document.getElementById('error-actions').classList.add('hidden');
      codigoSelecionado = '';
      document.getElementById('etapa-senha').classList.add('hidden');
      document.getElementById('etapa-codigo').classList.remove('hidden');
      mostrarMsg('', '');
    }

    function mostrarMsg(texto, tipo) {
      const el = document.getElementById('login-msg');
      el.textContent = texto;
      el.className = 'login-msg';
      if (tipo) el.classList.add(`msg-${tipo}`);
    }

    document.getElementById('codigo-manual').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') verificarCracha();
    });

    document.getElementById('input-senha').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fazerLogin();
    });

    // Ao voltar da tela de bloqueio/background, forcar conexão nova (mata socket morto)
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        const randomSeed = '?' + Math.random();
        const cacheBuster = CONFIG.API_URL.includes('?') ? '&' : '?';
        fetch(CONFIG.API_URL + cacheBuster + 'cache=' + Date.now(), {
          method: 'GET',
          cache: 'no-store',
          signal: AbortSignal.timeout(2000)
        }).catch(() => {});
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .catch(err => console.warn('SW:', err));
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data && event.data.type === 'SW_UPDATED') location.reload();
      });
    }
  </script>
</body>
</html>
